# Netlify Configuration for Idarah Mosque & Madrasa Management
[build]
  publish = "."
  # Writes supabase-config.js from VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY (Netlify env vars)
  command = "node scripts/generate-config.js"

[[headers]]
  for = "/supabase-config.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Security and PWA Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
